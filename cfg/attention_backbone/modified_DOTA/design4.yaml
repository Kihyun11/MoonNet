# train_aug_obb.yaml — Ultralytics YOLOv8-OBB
mode: train
task: obb

data: path/to/your/modified-DOTA/data.yaml
model: path/to/your/design4_backbone.yaml
pretrained: False

epochs: 50
imgsz: 640
batch: 4
device: 0
patience: 25

optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Augmentation (default)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0
translate: 0.10
scale: 0.50
shear: 0
perspective: 0.0
flipud: 0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.0

save: true
project: runs/train
name: yolov8n_obb_design4
