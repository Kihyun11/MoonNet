scale: 0.0
shear: 0
perspective: 0.0
flipud: 0
fliplr: 0.0
bgr: 0.0
mosaic: 0.0
mixup: 0.0

auto_augment: null
erasing: 0.0

close_mosaic: 0

save: true
project: runs/train/final_config
name: final_config_method2
